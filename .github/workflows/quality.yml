name: KidBum quality checks
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  clinical-functional-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show Node version
        run: node --version
      - name: Orthopedics clinical algorithms — reachability and calculator links
        if: ${{ !cancelled() }}
        run: node tests/ortopedia-algoritmos-v01082.cjs
      - name: Orthopedics bank — formula boundaries and missing data
        if: ${{ !cancelled() }}
        run: node tests/ortopedia-v01080.cjs
      - name: Neurología PRO 12 tools, fixtures and validation
        run: node tests/neurologia-pro-v01092.cjs
      - name: Neurología clinical pathways and graph safety
        run: node tests/neurologia-algoritmos-v01093.cjs
      - name: Pediatría BOARD pilot — bank, scores and review
        run: node tests/pediatria-board.cjs
      - name: Pediatría BOARD Ivory Heritage — mobile and desktop interaction
        if: ${{ !cancelled() }}
        run: node tests/pediatria-board-ivory-browser.cjs
      - name: SAMPLE pediatric history tool
        run: node tests/pediatria-sample-v01095.cjs
      - name: Ophthalmology first-contact routes and Pharma PRO crosslinks
        if: ${{ !cancelled() }}
        run: node tests/oftalmologia-algoritmos-v01075.cjs
      - name: Pharma PRO therapeutic lines for all remaining catalog entries
        if: ${{ !cancelled() }}
        run: node tests/pharma-therapeutic-lines-v01089.cjs
      - name: Pharma PRO antibiotics — scoped therapeutic lines
        if: ${{ !cancelled() }}
        run: node tests/pharma-antibioticos-v01088.cjs
      - name: Pharma PRO Coral and Jade UI and preserved safeguards
