name: KidBum quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  clinical-functional-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Show Node version
        run: node --version
      - name: Existing regression checks
        run: node tests/regression.cjs
      - name: Defensive functional audit
        run: node tests/safety-audit.cjs
      - name: Analytics privacy and installation checks
        run: node tests/analytics.cjs
      - name: Pediatric pharmacy placement and safety
        run: node tests/pediatric-pharmacy.cjs
      - name: Pediatric oral dose safety and arithmetic
        run: node tests/pediatric-drug-doses.cjs
      - name: Mobile data and offline startup
        run: node tests/pwa-cellular.cjs
      - name: First-launch airplane mode for all 133 clinical tools
        run: node tests/offline-110.cjs
      - name: APACHE II score and example audit
        run: node tests/apache2.cjs
      - name: Renal and electrolyte calculations and safety
        run: node tests/electrolytes.cjs
      - name: Adult urinary output and KDIGO threshold safety
        run: node tests/urine-output-adult.cjs
      - name: Reference image — seven new clinical calculators
        run: node tests/clinical-image-additions.cjs
      - name: SNNOOP10 headache flags and offline safety
        run: node tests/snnoop10.cjs
      - name: Clinical documentation editor and local PDF safety
        run: node tests/documentacion.cjs
      - name: Pediatric history eighteen sections and local PDF
        run: node tests/historia-pediatria.cjs
      - name: Documentation theme inheritance and pediatric selectors
        run: node tests/docs-theme-selectors.cjs
      - name: Pediatric mobile collapsible groups
        run: node tests/pediatric-mobile-groups.cjs
      - name: Oculomotor simulator navigation
        run: node tests/ocular-simulator-link.cjs
      - name: Pharma Pro UX 2.0 source states, original clinical engines and offline support
        run: node tests/pharma-ux-v01038.cjs
      - name: Real headless Chrome UX smoke test, safety gating and mobile layout
        run: node tests/pharma-browser-ux-v01038.cjs
      - name: Pediatric visual triad clinical engine, sources, safety and offline
        run: node tests/pediatria-rapid-v01039.cjs
      - name: Kramer neonatal objective-data support, AAP guardrails and offline safety
        run: node tests/kramer-clinical-v01041.cjs
      - name: Pediatric rapid tools in real headless Chromium
        run: node tests/pediatria-rapid-browser-v01039.cjs
      - name: Pharma Pro shared dark/light theme persistence and accessible toggle
        run: node tests/pharma-theme-sync-v01037.cjs
      - name: Graphite Noir across 13 modules, WCAG contrasts, PWA and light-theme invariance
        run: node tests/dark-graphite-v01036.cjs
      - name: Phone-first UI, safe-area, single-column forms and offline mobile styles
        run: node tests/mobile-first-v01035.cjs
      - name: Mobile Inicio breadcrumb navigation
        run: node tests/mobile-home-breadcrumb.cjs
      - name: PWA refresh and home navigation
        run: node tests/pwa-refresh-navigation.cjs
      - name: Clinical workspace premium UI safety
        run: node tests/clinical-premium-ui.cjs
      - name: Adult Wallace rule of nines
        run: node tests/wallace-adults.cjs
      - name: Wallace anatomical image hotspots
        run: node tests/wallace-hotspots.cjs
      - name: Wallace anatomy image file integrity
        run: node tests/wallace-image-integrity.cjs
      - name: Wallace enlarged anatomical views
        run: node tests/wallace-expanded-anatomy.cjs
      - name: Wallace original image default and fallback
        run: node tests/wallace-original-hd.cjs
      - name: Wallace card image and clean calculator
        run: node tests/wallace-cover-clean.cjs
      - name: Cardiopulmonary score regression tests
        run: node tests/cardioembolia-scores.cjs
      - name: Dynamic calculator catalog counts
        run: node tests/catalog-counts.cjs
      - name: Cardio scale card artwork
        run: node tests/cardio-card-images.cjs
      - name: Card imagery and SNNOOP10 theme regressions
        run: node tests/cardio-images-snnoop-theme.cjs
      - name: Capurro neonatal clinical and illustration tests
        run: node tests/capurro-neonatal.cjs
      - name: ChatGPT analysis for standalone calculators
        run: node tests/chatgpt-standalone-analysis.cjs
      - name: Twenty additional clinical scores and safety tests
        run: node tests/expansion-20.cjs
      - name: Required fictitious clinical examples on all standalone tools
        run: node tests/fictitious-examples-26.cjs
      - name: Geriatrics category portrait and navigation
        run: node tests/geriatria-category-cover.cjs
      - name: Geriatrics functional, nutrition and frailty scales
        run: node tests/geriatria-scales.cjs
      - name: Hepatology factor R and five companion clinical formulas
        run: node tests/hepatologia-indices.cjs
      - name: Rapid Pharma Pro mobile UX and 15 verified treatment pathways
        run: node tests/pharma-fast-ux.cjs
      - name: Pharma Pro 227-medication disease pathways and LASA evidence
        run: node tests/pharma-indications-lasa.cjs
      - name: Three additional high-alert drug monographs and fail-closed eligibility
        run: node tests/pharma-high-alert.cjs
      - name: Pharmacy source-label audit, safety gating and six preparation reference cards
        run: node tests/pharma-source-audit.cjs
      - name: Pharmacy source-verified limited monographs and safety-gated labeled dose references
        run: node tests/pharma-monographs.cjs
      - name: Pharma Pro catalog, safety and adjacent homepage quick link
        run: node tests/pharma-pro.cjs
      - name: Six Diabetes and Insulin Pro tools including DKA/HHS safety
        run: node tests/diabetes-insulin-pro.cjs
      - name: Guardia Pro HIT, Padua and IMPROVE Bleeding scoring and safety
        run: node tests/guardia-pro.cjs
      - name: Integrated arterial blood gas and engine reuse
        run: node tests/guardia-gasometria.cjs
      - name: Capture pediatric visual tools in mobile and desktop for UX review
        if: always()
        run: |
          mkdir -p pediatric-qa-screens
          node tests/pediatria-rapid-fixtures-v01039.cjs
          CHROME="$(command -v google-chrome || command -v chromium || command -v google-chrome-stable)"
          test -n "$CHROME"
          for view in tep wood kramer kramer5 dark; do
            for size in mobile desktop; do
              if [ "$size" = "mobile" ]; then DIMS="390,1100"; else DIMS="1366,900"; fi
              timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
                --allow-file-access-from-files --no-first-run --disable-extensions --virtual-time-budget=3200 \
                --window-size="$DIMS" --user-data-dir="$(mktemp -d)" \
                --screenshot="$PWD/pediatric-qa-screens/rapid-$view-$size.png" \
                "file://$PWD/.pediatria-visual-$view.html" >/dev/null 2>&1
              test -s "pediatric-qa-screens/rapid-$view-$size.png"
            done
          done
          rm -f .pediatria-visual-*.html
          ls -lh pediatric-qa-screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kidbum-pediatric-rapid-v01039-screens
          path: pediatric-qa-screens/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Capture Pharma Pro UX candidate screenshots for visual review
        if: always()
        run: |
          mkdir -p qa-screens
          node tests/pharma-visual-fixtures-v01038.cjs
          CHROME="$(command -v google-chrome || command -v chromium || command -v google-chrome-stable)"
          test -n "$CHROME"
          for view in list detail full dark; do
            case "$view" in
              detail) TARGET="file://$PWD/pharma-pro.html#ceftriaxona" ;;
              full) TARGET="file://$PWD/.pharma-visual-full.html" ;;
              dark) TARGET="file://$PWD/.pharma-visual-dark.html" ;;
              *) TARGET="file://$PWD/pharma-pro.html" ;;
            esac
            for size in mobile desktop; do
              if [ "$size" = "mobile" ]; then DIMS="390,844"; else DIMS="1366,900"; fi
              timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --allow-file-access-from-files \
                --no-first-run --disable-extensions --virtual-time-budget=3200 --window-size="$DIMS" \
                --user-data-dir="$(mktemp -d)" --screenshot="$PWD/qa-screens/pharma-$view-$size.png" "$TARGET" >/dev/null 2>&1
              test -s "qa-screens/pharma-$view-$size.png"
            done
          done
          ls -lh qa-screens
          rm -f .pharma-visual-full.html .pharma-visual-dark.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pharma-ux-v01038-visual-review
          path: qa-screens/*.png
          if-no-files-found: warn
          retention-days: 14
