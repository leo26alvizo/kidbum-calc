name: KidBum quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  clinical-functional-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Show Node version
        run: node --version
      - name: Existing regression checks
        run: node tests/regression.cjs
      - name: Defensive functional audit
        run: node tests/safety-audit.cjs
      - name: Analytics privacy and installation checks
        run: node tests/analytics.cjs
      - name: Pediatric pharmacy placement and safety
        run: node tests/pediatric-pharmacy.cjs
      - name: Pediatric oral dose safety and arithmetic
        run: node tests/pediatric-drug-doses.cjs
      - name: Mobile data and offline startup
        run: node tests/pwa-cellular.cjs
      - name: APACHE II score and example audit
        run: node tests/apache2.cjs
      - name: Renal and electrolyte calculations and safety
        run: node tests/electrolytes.cjs
      - name: Adult urinary output and KDIGO threshold safety
        run: node tests/urine-output-adult.cjs
      - name: Reference image — seven new clinical calculators
        run: node tests/clinical-image-additions.cjs
      - name: SNNOOP10 headache flags and offline safety
        run: node tests/snnoop10.cjs
      - name: Clinical documentation editor and local PDF safety
        run: node tests/documentacion.cjs
      - name: Pediatric history eighteen sections and local PDF
        run: node tests/historia-pediatria.cjs
      - name: Documentation theme inheritance and pediatric selectors
        run: node tests/docs-theme-selectors.cjs
      - name: Pediatric mobile collapsible groups
        run: node tests/pediatric-mobile-groups.cjs
      - name: Oculomotor simulator navigation
        run: node tests/ocular-simulator-link.cjs
      - name: Mobile Inicio breadcrumb navigation
        run: node tests/mobile-home-breadcrumb.cjs
      - name: PWA refresh and home navigation
        run: node tests/pwa-refresh-navigation.cjs
      - name: Clinical workspace premium UI safety
        run: node tests/clinical-premium-ui.cjs
      - name: Adult Wallace rule of nines
        run: node tests/wallace-adults.cjs
      - name: Wallace anatomical image hotspots
        run: node tests/wallace-hotspots.cjs
      - name: Wallace anatomy image file integrity
        run: node tests/wallace-image-integrity.cjs
      - name: Wallace enlarged anatomical views
        run: node tests/wallace-expanded-anatomy.cjs
      - name: Wallace original image default and fallback
        run: node tests/wallace-original-hd.cjs
      - name: Wallace card image and clean calculator
        run: node tests/wallace-cover-clean.cjs
      - name: Cardiopulmonary score regression tests
        run: node tests/cardioembolia-scores.cjs
      - name: Dynamic calculator catalog counts
        run: node tests/catalog-counts.cjs
      - name: Cardio scale card artwork
        run: node tests/cardio-card-images.cjs
      - name: Card imagery and SNNOOP10 theme regressions
        run: node tests/cardio-images-snnoop-theme.cjs
      - name: Capurro neonatal clinical and illustration tests
        run: node tests/capurro-neonatal.cjs
      - name: ChatGPT analysis for standalone calculators
        run: node tests/chatgpt-standalone-analysis.cjs
      - name: Twenty additional clinical scores and safety tests
        run: node tests/expansion-20.cjs
