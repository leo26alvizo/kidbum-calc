        run: node tests/pharma-coral-jade-v01086.cjs
      - name: Pharma PRO Coral and Jade — real mobile Chromium interaction checks
        if: ${{ !cancelled() }}
        run: node tests/pharma-coral-jade-browser-v01086.cjs
      - name: Existing regression checks
        if: ${{ !cancelled() }}
        run: node tests/regression.cjs
      - name: Pharma PRO v0.10.85 — hospital product-specific references and fail-closed gates
        if: ${{ !cancelled() }}
        run: node tests/pharma-hospital-reference-v01085.cjs
      - name: Pharma PRO v0.10.84 — expanded catalog, clinical scenarios and safety crosslinks
        if: ${{ !cancelled() }}
        run: node tests/pharma-expansion-v01084.cjs
      - name: Pharma Pro broad expansion - 1566 searchable entries, 29 groups, no new dosing claims
        if: ${{ !cancelled() }}
        run: node tests/pharma-broad-index-v01058.cjs
