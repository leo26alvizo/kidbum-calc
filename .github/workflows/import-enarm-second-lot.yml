name: Import second clinical teaching image lot
on:
  push:
    branches: [enarm-visual-expansion-v01072]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve licensed images, optimize and verify offline pack
        run: |
          set -euo pipefail
          python -m pip install Pillow
          mkdir -p /tmp/kb-clinical
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/3/31/E0007951_%28CardioNetworks_ECGpedia%29.jpg' -o '/tmp/kb-clinical/ecg-06.jpg'
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/3/3e/E0007872_%28CardioNetworks_ECGpedia%29.jpg' -o '/tmp/kb-clinical/ecg-07.jpg'
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/1/1c/PulmEdema.PNG' -o '/tmp/kb-clinical/rx-05.jpg'
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/d/dc/Upright_X-ray_demonstrating_small_bowel_obstruction.jpg' -o '/tmp/kb-clinical/rx-06.jpg'
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/5/5e/Subduralandherniation.PNG' -o '/tmp/kb-clinical/ct-02.jpg'
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/a/af/Gallstones.PNG' -o '/tmp/kb-clinical/us-02.jpg'
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import io
          dest=Path('assets/enarm-clinical')
          for p in Path('/tmp/kb-clinical').glob('*.jpg'):
              with Image.open(p) as im:
                  im=im.convert('RGB')
                  im.thumbnail((2200,2200) if p.name.startswith('ecg') else (1400,1400),Image.Resampling.LANCZOS)
                  im.save(dest/p.name,format='JPEG',quality=80,optimize=True,progressive=True,subsampling=2)
                  print(p.name, im.size, (dest/p.name).stat().st_size)
          # Preserve existing ECG pixel dimensions; optimize chroma and encoding only.
          for p in dest.glob('ecg-0[2345].jpg'):
              original=p.read_bytes()
              with Image.open(p) as im:
                  buf=io.BytesIO()
                  im.convert('RGB').save(buf,format='JPEG',quality=80,optimize=True,progressive=True,subsampling=2)
                  if len(buf.getvalue())<len(original): p.write_bytes(buf.getvalue())
                  print(p.name,im.size,len(original),p.stat().st_size)
          PY
          node tests/enarm-visual-radar-draft.cjs
          node tests/offline-110.cjs
      - name: Store local image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/enarm-clinical
          if ! git diff --cached --quiet; then
            git commit -m "Vendor six additional sourced studies and optimize local ECG storage"
            git push origin HEAD:enarm-visual-expansion-v01072
          fi
