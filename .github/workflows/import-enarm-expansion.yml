name: Import expanded clinical teaching images
on:
  push:
    branches: [enarm-visual-expansion-v01072]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve licensed originals, compress and verify offline pack
        run: |
          set -euo pipefail
          python -m pip install Pillow
          mkdir -p /tmp/kb-clinical
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/0/02/E24_(CardioNetworks_ECGpedia).jpg' -o '/tmp/kb-clinical/ecg-03.jpg'
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/d/d6/E232_(CardioNetworks_ECGpedia).jpg' -o '/tmp/kb-clinical/ecg-04.jpg'
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/2/2f/ICBA00011_(CardioNetworks_ECGpedia).jpg' -o '/tmp/kb-clinical/ecg-05.jpg'
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/f/f8/LLL_pneumonia_with_effusionM.jpg' -o '/tmp/kb-clinical/rx-02.jpg'
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/3/30/Effusionhalf.PNG' -o '/tmp/kb-clinical/rx-03.jpg'
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/e/e3/Collesfracture.jpg' -o '/tmp/kb-clinical/rx-04.jpg'
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/f/f9/EpiduralHematoma.jpg' -o '/tmp/kb-clinical/ct-01.jpg'
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in Path('/tmp/kb-clinical').glob('*.jpg'):
              with Image.open(p) as im:
                  im=im.convert('RGB')
                  im.thumbnail((2200,2200) if p.name.startswith('ecg') else (1400,1400),Image.Resampling.LANCZOS)
                  im.save(Path('assets/enarm-clinical')/p.name,format='JPEG',quality=80,optimize=True,progressive=True,subsampling=0)
                  print(p.name, im.size, (Path('assets/enarm-clinical')/p.name).stat().st_size)
          PY
          node tests/enarm-visual-radar-draft.cjs
          node tests/offline-110.cjs
      - name: Store local image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/enarm-clinical
          if ! git diff --cached --quiet; then
            git commit -m "Vendor seven licensed clinical studies for offline ENARM"
            git push origin HEAD:enarm-visual-expansion-v01072
          fi
