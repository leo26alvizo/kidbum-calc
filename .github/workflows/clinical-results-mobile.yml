name: Clinical Results — responsive browser smoke
on:
  pull_request:
    paths:
      - 'index.html'
      - 'pediatria-pas.html'
      - 'guardia-pro.html'
      - 'sw.js'
      - 'assets/**'
      - 'tests/clinical-results-v01061.cjs'
      - '.github/workflows/clinical-results-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Check test syntax
        run: node --check tests/clinical-results-v01061.cjs
      - name: Browser smoke at 320, 390, 430 and 768 px
        run: node tests/clinical-results-v01061.cjs
