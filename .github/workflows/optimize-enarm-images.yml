name: Optimize local clinical images
on:
  push:
    branches: [enarm-clinical-images-v01070]
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize JPEG files and enforce existing offline budget
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import io
          for p in sorted(Path('assets/enarm-clinical').glob('*.jpg')):
              raw=p.read_bytes()
              with Image.open(p) as im:
                  im=im.convert('RGB')
                  im.thumbnail((2400,2400) if p.name.startswith('ecg') else (1600,1600),Image.Resampling.LANCZOS)
                  buf=io.BytesIO()
                  im.save(buf,format='JPEG',quality=83,optimize=True,progressive=True,subsampling=0)
                  data=buf.getvalue()
                  if len(data)<len(raw):
                      p.write_bytes(data)
                  print(p,im.size,len(raw),p.stat().st_size)
          PY
          node tests/enarm-visual-radar-draft.cjs
          node tests/offline-110.cjs
      - name: Commit optimized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/enarm-clinical/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Optimize clinical JPEGs within existing offline budget"
            git push origin HEAD:enarm-clinical-images-v01070
          fi
