name: Import licensed ENARM image assets
on:
  push:
    branches: [enarm-clinical-images-v01070]
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download reviewed files and verify JPEG format
        run: |
          set -euo pipefail
          mkdir -p assets/enarm-clinical
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/4/47/Nsr_%28CardioNetworks_ECGpedia%29.jpg' -o 'assets/enarm-clinical/ecg-01.jpg'
          test "$(file -b --mime-type 'assets/enarm-clinical/ecg-01.jpg')" = image/jpeg
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/6/65/E000749_%28CardioNetworks_ECGpedia%29.jpg' -o 'assets/enarm-clinical/ecg-02.jpg'
          test "$(file -b --mime-type 'assets/enarm-clinical/ecg-02.jpg')" = image/jpeg
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/8/80/X-ray_of_pneumothorax_in_pneumocystis_pneumonia.jpg' -o 'assets/enarm-clinical/rx-01.jpg'
          test "$(file -b --mime-type 'assets/enarm-clinical/rx-01.jpg')" = image/jpeg
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/d/d9/Intussusception_on_ultrasound.jpg' -o 'assets/enarm-clinical/us-01.jpg'
          test "$(file -b --mime-type 'assets/enarm-clinical/us-01.jpg')" = image/jpeg
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/6/6b/Koplik_spots%2C_measles_6111_lores.jpg' -o 'assets/enarm-clinical/clinical-01.jpg'
          test "$(file -b --mime-type 'assets/enarm-clinical/clinical-01.jpg')" = image/jpeg
          curl --fail --location --retry 3 --max-time 90 --user-agent 'KidBum educational app (github.com/leo26alvizo/kidbum-calc)' 'https://upload.wikimedia.org/wikipedia/commons/7/71/Mycobacterium_tuberculosis_Ziehl-Neelsen_stain_02.jpg' -o 'assets/enarm-clinical/micro-01.jpg'
          test "$(file -b --mime-type 'assets/enarm-clinical/micro-01.jpg')" = image/jpeg
          node tests/enarm-visual-radar-draft.cjs
      - name: Commit images to development branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/enarm-clinical/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Vendor six licensed clinical image assets for offline use"
            git push origin HEAD:enarm-clinical-images-v01070
          fi
